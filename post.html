<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yunji Tech</title><link rel="stylesheet" href="/styles.css"><style>.md-shell{max-width:760px;margin:0 auto;padding:84px 24px 140px}.md-head{margin-bottom:58px}.md-back{font-size:13px;color:#8b95a1}.md-category{font-size:13px;font-weight:700;color:#3182f6;margin-top:34px}.md-head h1{font-size:50px;line-height:1.22;letter-spacing:-.055em;margin:12px 0 18px}.md-source{color:#8b95a1;font-size:13px}.markdown-body{font-size:17px;line-height:1.92;color:#333d4b}.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{color:#191f28;letter-spacing:-.04em;scroll-margin-top:90px}.markdown-body h1{font-size:36px;margin:82px 0 24px}.markdown-body h2{font-size:30px;line-height:1.38;margin:78px 0 22px}.markdown-body h3{font-size:23px;line-height:1.45;margin:46px 0 16px}.markdown-body h4{font-size:19px;margin:34px 0 12px}.markdown-body p{margin:14px 0}.markdown-body li{margin:7px 0}.markdown-body ul,.markdown-body ol{padding-left:25px}.markdown-body a{color:#3182f6;text-decoration:underline;text-decoration-color:#c8ddff;text-underline-offset:3px}.markdown-body blockquote{margin:30px 0;padding:4px 0 4px 22px;border-left:3px solid #3182f6;color:#4e5968;font-size:18px}.markdown-body pre{overflow:auto;background:#191f28;color:#f2f4f6;border-radius:18px;padding:22px 24px;line-height:1.65;font-size:14px;margin:28px 0}.markdown-body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.markdown-body :not(pre)>code{background:#f2f4f6;border-radius:6px;padding:2px 6px;font-size:.9em;color:#4e5968}.markdown-body table{display:block;overflow-x:auto;width:100%;border-collapse:collapse;margin:30px 0;font-size:14px}.markdown-body th,.markdown-body td{border-bottom:1px solid #e5e8eb;padding:13px 12px;text-align:left;vertical-align:top;line-height:1.65}.markdown-body th{background:#f7f8fa;color:#4e5968}.markdown-body img{display:block;max-width:min(100vw - 40px,980px);width:auto;height:auto;border-radius:18px;margin:38px 50%;transform:translateX(-50%);box-shadow:0 1px 0 rgba(0,0,0,.03)}.markdown-body callout{display:block;background:#f4f7fb;border-radius:18px;padding:22px 24px;margin:28px 0}.markdown-body columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(980px,calc(100vw - 40px));margin-left:50%;transform:translateX(-50%)}.markdown-body column{display:block}.markdown-body empty-block{display:block;height:8px}.markdown-body table_of_contents{display:none}.markdown-body page{display:block;margin:12px 0;color:#3182f6}.loading{color:#8b95a1}.reading-progress{position:fixed;top:69px;left:0;height:2px;background:#3182f6;width:0;z-index:40}.auto-toc{position:fixed;left:max(20px,calc(50vw - 590px));top:130px;width:180px;font-size:12px;line-height:1.5;color:#8b95a1}.auto-toc b{display:block;color:#4e5968;margin-bottom:10px}.auto-toc a{display:block;margin:8px 0}.auto-toc a:hover{color:#3182f6}@media(max-width:1120px){.auto-toc{display:none}}@media(max-width:700px){.md-shell{padding:58px 20px 100px}.md-head h1{font-size:36px}.markdown-body{font-size:16px}.markdown-body h2{font-size:27px}.markdown-body columns{grid-template-columns:1fr}}</style></head><body><header class="site-head"><div class="wrap head-in"><a class="brand" href="/">Yunji Tech</a><nav><a href="/">Engineering</a><a href="/#series">Series</a><a href="https://wendyunji-resume.vercel.app">About</a></nav></div></header><div class="reading-progress" id="progress"></div><aside class="auto-toc" id="toc"></aside><main class="md-shell"><div class="md-head"><a class="md-back" href="/">← 전체 아티클</a><div class="md-category" id="post-category"></div><h1 id="post-title">Loading…</h1><div class="md-source" id="post-source"></div></div><article id="markdown" class="markdown-body"><p class="loading">Markdown loading…</p></article></main><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>const params=new URLSearchParams(location.search);const slug=params.get('slug');function buildToc(){const hs=[...document.querySelectorAll('#markdown h2')];if(hs.length<3)return;const toc=document.getElementById('toc');toc.innerHTML='<b>Contents</b>';hs.forEach((h,i)=>{if(!h.id)h.id='section-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;toc.appendChild(a)})}async function load(){if(!slug){document.getElementById('post-title').textContent='Post not found';return}try{const index=await fetch('/content/index.json').then(r=>r.json());const meta=index.find(x=>x.slug===slug)||{};document.getElementById('post-title').textContent=meta.title||slug;document.getElementById('post-category').textContent=meta.category||'Engineering';document.title=(meta.title||slug)+' — Yunji Tech';document.getElementById('post-source').textContent=meta.date?meta.date+' · Yunji':'';const md=await fetch('/content/'+slug+'.md').then(r=>{if(!r.ok)throw new Error('missing');return r.text()});marked.setOptions({gfm:true,breaks:false});document.getElementById('markdown').innerHTML=marked.parse(md);buildToc()}catch(e){document.getElementById('markdown').innerHTML='<p>Markdown file을 불러오지 못했습니다.</p>'}}window.addEventListener('scroll',()=>{const d=document.documentElement;const max=d.scrollHeight-d.clientHeight;document.getElementById('progress').style.width=(max?d.scrollTop/max*100:0)+'%'});load();</script></body></html>
