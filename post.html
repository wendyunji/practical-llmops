<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yunji Tech Notes</title><link rel="stylesheet" href="/styles.css"><style>.md-shell{max-width:980px;margin:0 auto;padding:72px 28px 140px}.md-head{margin-bottom:44px}.md-head a{color:#6b7280;text-decoration:none}.md-head h1{font-size:44px;line-height:1.18;letter-spacing:-.045em;margin:18px 0 8px}.md-source{color:#9aa0a6;font-size:13px}.markdown-body{font-size:16px;line-height:1.82;color:#2f343b}.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{color:#17191d;letter-spacing:-.025em;scroll-margin-top:80px}.markdown-body h1{font-size:36px;margin:64px 0 24px}.markdown-body h2{font-size:28px;margin:58px 0 20px;padding-top:8px;border-top:1px solid #edf0f3}.markdown-body h3{font-size:21px;margin:38px 0 14px}.markdown-body p{margin:12px 0}.markdown-body li{margin:5px 0}.markdown-body blockquote{margin:20px 0;padding:14px 18px;border-left:3px solid #3182f6;background:#f7f9fc;color:#444}.markdown-body pre{overflow:auto;background:#15191f;color:#eef2f6;border-radius:14px;padding:18px 20px;line-height:1.55}.markdown-body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.markdown-body :not(pre)>code{background:#f1f3f5;border-radius:5px;padding:2px 6px;font-size:.92em}.markdown-body table{display:block;overflow-x:auto;width:100%;border-collapse:collapse;margin:22px 0}.markdown-body th,.markdown-body td{border:1px solid #e6e9ed;padding:10px 12px;text-align:left;vertical-align:top}.markdown-body th{background:#f7f8fa}.markdown-body img{max-width:100%;height:auto;border-radius:10px}.markdown-body callout{display:block;background:#f6f8fb;border:1px solid #e7ebf0;border-radius:14px;padding:18px 20px;margin:22px 0}.markdown-body columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.markdown-body column{display:block}.markdown-body empty-block{display:block;height:8px}.markdown-body table_of_contents{display:none}.markdown-body page{display:block;margin:10px 0;color:#3182f6}.loading{color:#8a9099}@media(max-width:700px){.md-shell{padding:54px 20px 100px}.md-head h1{font-size:34px}.markdown-body columns{grid-template-columns:1fr}}</style></head><body><header class="site-head"><div class="wrap head-in"><a class="brand" href="/">Yunji Tech Notes</a><nav><a href="/">Notes</a><a href="/#archive">Archive</a></nav></div></header><main class="md-shell"><div class="md-head"><a href="/">← All notes</a><h1 id="post-title">Loading…</h1><div class="md-source" id="post-source"></div></div><article id="markdown" class="markdown-body"><p class="loading">Markdown loading…</p></article></main><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>const params=new URLSearchParams(location.search);const slug=params.get('slug');async function load(){if(!slug){document.getElementById('post-title').textContent='Post not found';return;}try{const index=await fetch('/content/index.json').then(r=>r.json());const meta=index.find(x=>x.slug===slug)||{};document.getElementById('post-title').textContent=meta.title||slug;document.title=(meta.title||slug)+' — Yunji Tech Notes';document.getElementById('post-source').textContent=meta.date?meta.date:'';const md=await fetch('/content/'+slug+'.md').then(r=>{if(!r.ok)throw new Error('missing');return r.text()});marked.setOptions({gfm:true,breaks:false});document.getElementById('markdown').innerHTML=marked.parse(md);}catch(e){document.getElementById('markdown').innerHTML='<p>Markdown file을 불러오지 못했습니다.</p>';}}load();</script></body></html>
